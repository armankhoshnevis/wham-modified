$include:
  - conf/in_cabin_4gpu/common.yml

fine_tune: true
fine_tune_checkpoint: ./runs/in_cabin_4gpu/domain/c2f/best/vampnet/weights.pth
save_path: ./runs/in_cabin_4gpu/specific/c2f

VampNet.vocab_size: 1024
VampNet.n_codebooks: 14
VampNet.n_conditioning_codebooks: 4
VampNet.r_cond_dim: 0
VampNet.noise_mode: mask
VampNet.embedding_dim: 1280
VampNet.n_layers: 16
VampNet.n_heads: 20
VampNet.flash_attn: false
VampNet.dropout: 0.1

AudioDataset.duration: 3.0
AudioDataset.loudness_cutoff: -40.0

train/AudioLoader.sources:
  - training_data/in_cabin_specific/train

val/AudioLoader.sources:
  - training_data/in_cabin_specific/val
