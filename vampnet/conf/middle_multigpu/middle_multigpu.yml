$include:
  - conf/lora/lora.yml

# Reproducibility
seed: 2026

# Training
num_iters: 4000
batch_size: 8
num_workers: 16
amp: true
train/AudioDataset.n_examples: 32000

# Validation
val_idx: [0]
val_freq: 1000

# Qualitative TensorBoard audio
sample_freq: 2000

# Numbered checkpoints must use multiples of 1000
save_iters: [1000, 2000, 3000]

# Optimization
AdamW.lr: 0.0001
NoamScheduler.warmup: 500
NoamScheduler.factor: 0.08
grad_clip_val: 5.0

# Dataset sampling
train/AudioDataset.without_replacement: false
val/AudioDataset.without_replacement: true
