$include:
  - conf/middle_multigpu/middle_multigpu.yml

fine_tune: true
fine_tune_checkpoint: ./runs/middle_multigpu_domain/coarse/best/vampnet/weights.pth
save_path: ./runs/middle_multigpu_specific/coarse

# Coarse architecture
VampNet.n_codebooks: 4
VampNet.n_conditioning_codebooks: 0
VampNet.embedding_dim: 1280
VampNet.n_layers: 20
VampNet.n_heads: 20

# Audio excerpts
AudioDataset.duration: 2.0
AudioDataset.loudness_cutoff: -30.0

# Validation set: 144 examples = 18 global batches of 8
val/AudioDataset.n_examples: 144

# Separate train and validation data
train/AudioLoader.sources:
  - training_data/species_specific/train

val/AudioLoader.sources:
  - training_data/species_specific/val
